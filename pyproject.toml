[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cacao-stomata-response"
version = "0.1.0"
description = "Trial-aware control-anchored analysis for cacao stomatal response data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scipy>=1.10"
]

[project.scripts]
cacao-stomata-response = "cacao_stomata_response.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
